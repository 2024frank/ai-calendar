name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Review Queue
        2. Open event …
        3. Click Approve
  - type: input
    id: ids
    attributes:
      label: Run, event or source ID
      description: If there is one. Please do not paste secrets, tokens or private data.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hosted Oberlin deployment
        - My own deployment
        - Local development
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      render: text
